image: registry.gitlab.com/ccp5/dlpoly-py/dlpoly:5.2.0-pre-828bbf70
cache:
  paths:
    - .pip-cache/

include:
  - remote: 'https://gitlab.com/deploy2zenodo/deploy2zenodo/-/releases/permalink/latest/downloads/deploy2zenodo.yaml'

before_script:
  - python3 -m venv py-ci && source ./py-ci/bin/activate
  - python --version
  - python3 -m pip install --upgrade pip
  - python3 -m pip install build twine
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

stages:
  - test
  - static
  - build
  - publish

flake8:
  stage: static
  script:
    - flake8 --max-line-length=120 dlpoly/*.py
    - flake8 --max-line-length=120 tests/test_*.py

# pylint:
#  stage: static
#  allow_failure: true
#  script:
#    - pylint -d C0301 dlpoly/*.py
#    - pylint -d C0301 examples/*.py

# mypy:
#  stage: static
#  allow_failure: true
#  script:
#  - for i in dlpoly/*.py; do python -m mypy $i; done

tests:
  stage: test
  script:
    - source ./py-ci/bin/activate
    - pip install .[all]
      #    - python -m unittest discover -s tests -p 'test_*.py'
    - source ~/.bashrc
    - module load dl_poly
    - tox

  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'

build:
  stage: build
  script:
    - python3 -m build
  artifacts:
    paths:
      - dist/

publish:
  only:
    - devel
    - tags
  stage: publish
  script:
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:

deploy2zenodo:
  only:
    - tags
    - devel
  image: alpine:latest
  stage: publish
  variables:
    DEPLOY2ZENODO_API_URL: "https://zenodo.org/api"
    DEPLOY2ZENODO_JSON: "CITATION.json"
    DEPLOY2ZENODO_DEPOSITION_ID: "create NEW record"
    DEPLOY2ZENODO_UPLOAD: "$CI_PROJECT_NAME-$CI_COMMIT_TAG.zip"
    DEPLOY2ZENODO_ADD_IsCompiledBy_DEPLOY2ZENODO: "yes"
    DEPLOY2ZENODO_ADD_IsNewVersionOf: "yes"
    DEPLOY2ZENODO_ADD_IsPartOf: "yes"
    DEPLOY2ZENODO_GET_METADATA: "result.json"
  before_script:
    - apk add --no-cache git jq cffconvert
    - publication_date=$(echo "$CI_COMMIT_TIMESTAMP" | grep -Eo "^[0-9]{4}-[0-9]{2}-[0-9]{2}")
    - |
      cffconvert -i CITATION.cff -f zenodo | \
        jq -c '{"metadata": .} | .metadata += {"upload_type": "software"}' | \
        jq -c ".metadata.related_identifiers += [
          {\"relation\": \"isDerivedFrom\",
          \"identifier\": \"$CI_SERVER_URL/projects/$CI_PROJECT_ID\"}] |
          .metadata.version = \"$CI_COMMIT_TAG\" |
          .metadata.publication_date = \"$publication_date\"" | \
        tee "$DEPLOY2ZENODO_JSON" | jq -C .
    - git archive --format zip --output "$DEPLOY2ZENODO_UPLOAD" "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - $DEPLOY2ZENODO_JSON
      - $DEPLOY2ZENODO_GET_METADATA
